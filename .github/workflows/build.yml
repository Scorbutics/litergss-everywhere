name: Build LiteRGSS

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "android,linux-x86_64,ios,macos"
        type: choice
        options:
          - "android,linux-x86_64,ios,macos"
          - "android,linux-x86_64,ios"
          - "android,linux-x86_64"
          - "android"
          - "linux-x86_64"
          - "linux-arm64"
          - "ios"
          - "macos"
          - "android,linux-x86_64,linux-arm64"
          - "android,linux-x86_64,linux-arm64,ios,macos"
      android_abis:
        description: "Android ABIs to include in the AAR (comma-separated)"
        required: false
        default: "arm64-v8a,x86_64"
        type: choice
        options:
          - "arm64-v8a,x86_64"
          - "arm64-v8a"
          - "x86_64"
      ruby_variant:
        description: "Ruby minor version to embed"
        required: false
        default: "3.0"
        type: choice
        options:
          - "3.0"
          - "3.2"
          - "3.3"
      backends:
        description: "Graphics backends: sfml (LiteRGSS2), raylib (LiteRGSS3: Ruby 3.2+, no iOS) or both"
        required: false
        default: "sfml"
        type: choice
        options:
          - "sfml"
          - "raylib"
          - "sfml,raylib"
      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - "release"
          - "debug"

# Build-wide defaults when triggered by push/PR (not workflow_dispatch)
env:
  DEFAULT_PLATFORMS: "android,linux-x86_64,ios,macos"
  DEFAULT_ANDROID_ABIS: "arm64-v8a,x86_64"
  DEFAULT_BUILD_TYPE: "release"
  # Ruby variant of master/PR builds and of the Package.swift on master
  DEFAULT_RUBY_VARIANT: "3.0"

jobs:
  # ---------------------------------------------------------------------------
  # Compute build parameters from inputs (or defaults for push/PR triggers)
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_type_flag: ${{ steps.set-params.outputs.build_type_flag }}
      has_android: ${{ steps.set-params.outputs.has_android }}
      has_linux_x86_64: ${{ steps.set-params.outputs.has_linux_x86_64 }}
      has_ios: ${{ steps.set-params.outputs.has_ios }}
      has_macos: ${{ steps.set-params.outputs.has_macos }}
      is_release: ${{ steps.set-params.outputs.is_release }}
      ruby_variant: ${{ steps.set-params.outputs.ruby_variant }}
      backends: ${{ steps.set-params.outputs.backends }}
      backends_json: ${{ steps.set-params.outputs.backends_json }}
      has_sfml: ${{ steps.set-params.outputs.has_sfml }}
      versions_json: ${{ steps.set-params.outputs.versions_json }}
      is_default_variant: ${{ steps.set-params.outputs.is_default_variant }}
      android_abis: ${{ steps.set-params.outputs.android_abis }}
      android_abis_json: ${{ steps.set-params.outputs.android_abis_json }}
      android_toolchain_args: ${{ steps.set-params.outputs.android_toolchain_args }}
      ios_targets_json: ${{ steps.set-params.outputs.ios_targets_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - id: set-params
        shell: bash
        run: |
          # One build embeds one Ruby variant (minor version), so every release
          # tag and Maven version carries it: vX.Y.Z-ruby3.0 / X.Y.Z-ruby3.0[-SNAPSHOT].
          # A tag builds its own variant; other triggers build the input or default one.
          # A debug build (workflow_dispatch, build_type: debug) is never a release
          # and carries -debug: X.Y.Z-ruby3.0-debug[-SNAPSHOT], never replacing the
          # optimised runtime of the same version, nor making a GitHub Release.
          BUILD_TYPE="${{ inputs.build_type || env.DEFAULT_BUILD_TYPE }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            DEBUG_SUFFIX="-debug"
          else
            DEBUG_SUFFIX=""
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ruby([0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release tags must be vX.Y.Z-rubyA.B (e.g. v1.2.0-ruby3.0), got $GITHUB_REF_NAME"
              exit 1
            fi
            RUBY_VARIANT="${BASH_REMATCH[1]}"
            BASE_VERSION="${GITHUB_REF_NAME#v}"
            SNAPSHOT_SUFFIX=""
            # A debug run on a tag is never a release
            if [ "$BUILD_TYPE" = "debug" ]; then
              echo "is_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "is_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            RUBY_VARIANT="${{ inputs.ruby_variant || env.DEFAULT_RUBY_VARIANT }}"
            # Read the submodule commit, then fetch NEXT_VERSION from it via the API
            SM_COMMIT=$(git ls-tree HEAD external/embedded-ruby-vm | awk '{print $3}')
            SM_REPO=$(git config --file .gitmodules submodule.external/embedded-ruby-vm.url | sed 's|.*github.com[:/]||;s|\.git$||')
            BASE_VERSION="$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://raw.githubusercontent.com/${SM_REPO}/${SM_COMMIT}/NEXT_VERSION" | tr -d '[:space:]')-ruby${RUBY_VARIANT}"
            SNAPSHOT_SUFFIX="-SNAPSHOT"
          fi
          echo "ruby_variant=$RUBY_VARIANT" >> "$GITHUB_OUTPUT"
          if [ "$RUBY_VARIANT" = "${{ env.DEFAULT_RUBY_VARIANT }}" ]; then
            echo "is_default_variant=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_default_variant=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Ruby variant: $RUBY_VARIANT"

          # The graphics backends, each a matrix axis of the build and install
          # jobs, all packaged and released by this one run. Manual runs: the
          # input. Release tags: sfml, and raylib (LiteRGSS3) from Ruby 3.2 on.
          # Pushes and PRs: sfml.
          case "$RUBY_VARIANT" in
            3.0|3.1) RAYLIB_OK=false ;;
            *)       RAYLIB_OK=true ;;
          esac
          if [ -n "${{ inputs.backends }}" ]; then
            BACKENDS="${{ inputs.backends }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$RAYLIB_OK" = true ]; then
            BACKENDS="sfml,raylib"
          else
            BACKENDS="sfml"
          fi
          BACKENDS_JSON=$(echo "$BACKENDS" | jq -Rc 'split(",") | map(ltrimstr(" ") | rtrimstr(" "))')
          if jq -e 'index("raylib")' <<< "$BACKENDS_JSON" >/dev/null && [ "$RAYLIB_OK" != true ]; then
            echo "::error::The raylib backend (LiteRGSS3) needs Ruby 3.2 or newer, not $RUBY_VARIANT"
            exit 1
          fi
          if jq -e 'index("sfml")' <<< "$BACKENDS_JSON" >/dev/null; then HAS_SFML=true; else HAS_SFML=false; fi
          echo "backends=$BACKENDS" >> "$GITHUB_OUTPUT"
          echo "backends_json=$BACKENDS_JSON" >> "$GITHUB_OUTPUT"
          echo "has_sfml=$HAS_SFML" >> "$GITHUB_OUTPUT"
          echo "Graphics backends: $BACKENDS"

          # The versions, per backend. raylib carries -raylib after the Ruby
          # variant: X.Y.Z-ruby3.3-raylib[-debug][-SNAPSHOT], the same artifacts
          # as sfml's under another version (one runtime per app: the two
          # cannot coexist), in the same GitHub Release. Package.swift, iOS and
          # the Kotlin host are sfml's only.
          # The Tracy runtime (--enable-tracy), for debug builds: <version>-tracy,
          # before -SNAPSHOT so that Maven still sees a snapshot.
          VERSIONS_JSON='{}'
          for BACKEND in $(jq -r '.[]' <<< "$BACKENDS_JSON"); do
            case "$BACKEND" in
              sfml)   BACKEND_SUFFIX="" ;;
              raylib) BACKEND_SUFFIX="-raylib" ;;
              *) echo "::error::Unknown graphics backend '$BACKEND' (sfml or raylib)"; exit 1 ;;
            esac
            V="${BASE_VERSION}${BACKEND_SUFFIX}${DEBUG_SUFFIX}"
            VERSIONS_JSON=$(jq -c --arg b "$BACKEND" --arg v "${V}${SNAPSHOT_SUFFIX}" --arg t "${V}-tracy${SNAPSHOT_SUFFIX}" \
              '.[$b] = {version: $v, tracy: $t}' <<< "$VERSIONS_JSON")
          done
          echo "versions_json=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"
          echo "Versions: $VERSIONS_JSON"

          PLATFORMS="${{ inputs.platforms || env.DEFAULT_PLATFORMS }}"
          ANDROID_ABIS="${{ inputs.android_abis || env.DEFAULT_ANDROID_ABIS }}"

          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "build_type_flag=--enable-debug" >> "$GITHUB_OUTPUT"
          else
            echo "build_type_flag=--enable-release" >> "$GITHUB_OUTPUT"
          fi

          echo "android_abis=$ANDROID_ABIS" >> "$GITHUB_OUTPUT"

          # Convert comma-separated ABIs to JSON array for matrix strategy
          ABIS_JSON=$(echo "$ANDROID_ABIS" | jq -Rc 'split(",") | map(ltrimstr(" ") | rtrimstr(" "))')
          echo "android_abis_json=$ABIS_JSON" >> "$GITHUB_OUTPUT"

          # iOS always builds device + simulator
          echo 'ios_targets_json=["arm64-ios-device","arm64-ios-simulator"]' >> "$GITHUB_OUTPUT"

          # Build Android toolchain args
          TOOLCHAIN_ARGS=""
          IFS=',' read -ra ABIS <<< "$ANDROID_ABIS"
          for abi in "${ABIS[@]}"; do
            abi=$(echo "$abi" | xargs)
            TOOLCHAIN_ARGS+=" --with-toolchain-params=toolchain-params/${abi}-android-toolchain.params"
          done
          echo "android_toolchain_args=$TOOLCHAIN_ARGS" >> "$GITHUB_OUTPUT"

          # Export platform presence flags
          echo "has_android=false" >> "$GITHUB_OUTPUT"
          echo "has_linux_x86_64=false" >> "$GITHUB_OUTPUT"
          echo "has_ios=false" >> "$GITHUB_OUTPUT"
          echo "has_macos=false" >> "$GITHUB_OUTPUT"
          IFS=',' read -ra PLATS <<< "$PLATFORMS"
          for plat in "${PLATS[@]}"; do
            plat=$(echo "$plat" | xargs)
            case "$plat" in
              android)        echo "has_android=true" >> "$GITHUB_OUTPUT" ;;
              linux-x86_64)   echo "has_linux_x86_64=true" >> "$GITHUB_OUTPUT" ;;
              ios)
                # raylib 6 has no iOS platform: iOS is sfml's only
                if [ "$HAS_SFML" = true ]; then
                  echo "has_ios=true" >> "$GITHUB_OUTPUT"
                else
                  echo "::notice::No iOS with the raylib backend (raylib 6 has no iOS platform): iOS skipped"
                fi ;;
              macos)          echo "has_macos=true" >> "$GITHUB_OUTPUT" ;;
            esac
          done

  # ===========================================================================
  #  BUILD PHASE — configure + make build (parallel across platforms)
  # ===========================================================================

  # --- Android (Docker, parallel per ABI) ---
  build-android:
    needs: prepare
    if: needs.prepare.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJson(needs.prepare.outputs.android_abis_json) }}
        backend: ${{ fromJson(needs.prepare.outputs.backends_json) }}
    # Both runtimes, one after the other in the same build tree: the release
    # one, then the Tracy one (<version>-tracy, debug builds). --enable-tracy
    # only rebuilds LiteCGSS, LiteRGSS2, extension-init.o and the fat library.
    name: Build Android (${{ matrix.backend }}, ${{ matrix.abi }})
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache dependencies (URL tarballs)
        uses: actions/cache@v4
        with:
          path: build-android/downloads
          key: deps-url-android-${{ matrix.abi }}-${{ hashFiles('cmake/litergss-app/dependencies/*.cmake') }}-v5
          restore-keys: |
            deps-url-android-${{ matrix.abi }}-
            deps-url-android-

      - name: Cache dependencies (git repos)
        uses: actions/cache@v4
        with:
          path: build-android/git-cache
          key: deps-git-android-${{ matrix.abi }}-${{ hashFiles('cmake/litergss-app/dependencies/*.cmake') }}
          restore-keys: |
            deps-git-android-${{ matrix.abi }}-
            deps-git-android-

      - name: Pre-download dependencies
        run: |
          cmake \
            -DDEPS_DIR=${{ github.workspace }}/cmake/litergss-app/dependencies \
            -DDOWNLOAD_DIR=${{ github.workspace }}/build-android/downloads \
            -DGIT_CACHE_DIR=${{ github.workspace }}/build-android/git-cache \
            -P cmake/docker/PreloadDeps.cmake

      - name: Configure
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=${{ matrix.backend }} \
            --with-toolchain-params=toolchain-params/${{ matrix.abi }}-android-toolchain.params \
            --build-dir=build-android \
            --target-dir=target-android \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Build
        run: make build

      - name: Export build outputs
        run: make export

      - name: Configure (Tracy)
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=${{ matrix.backend }} \
            --with-toolchain-params=toolchain-params/${{ matrix.abi }}-android-toolchain.params \
            --build-dir=build-android \
            --target-dir=target-android-tracy \
            --enable-tracy \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Build (Tracy)
        run: make build

      - name: Export build outputs (Tracy)
        run: make export

      # The Tracy build is incremental, over the release one: a step that
      # did not rebuild would ship one runtime as the other
      - name: Check the Tracy client is in the Tracy runtime only
        run: |
          has_tracy() {
            nm --defined-only "$1" 2>/dev/null | grep -q ' T ___tracy_startup_profiler$'
          }
          RELEASE_LIB=target-android/fat-libs/${{ matrix.abi }}/librgss_runtime.a
          TRACY_LIB=target-android-tracy/fat-libs/${{ matrix.abi }}/librgss_runtime.a
          if has_tracy "$RELEASE_LIB"; then
            echo "::error::$RELEASE_LIB has the Tracy client"; exit 1
          fi
          if ! has_tracy "$TRACY_LIB"; then
            echo "::error::$TRACY_LIB has no Tracy client"; exit 1
          fi
          echo "Release runtime: no Tracy client. Tracy runtime: Tracy client."

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-android-${{ matrix.backend }}-${{ matrix.abi }}
          path: target-android/
          if-no-files-found: error
          retention-days: 1

      - name: Upload build outputs (Tracy)
        uses: actions/upload-artifact@v4
        with:
          # build-tracy-android-*: not matched by the release install's build-android-*
          name: build-tracy-android-${{ matrix.backend }}-${{ matrix.abi }}
          path: target-android-tracy/
          if-no-files-found: error
          retention-days: 1

  # --- Linux x86_64 (local) ---
  # A binary only runs on the glibc it was linked against or a newer one, and
  # ubuntu-latest keeps moving. Not older: the prebuilt embedded-ruby-vm and
  # ruby-for-android objects need glibc 2.38 (__isoc23_* symbols).
  build-linux-x86_64:
    needs: prepare
    if: needs.prepare.outputs.has_linux_x86_64 == 'true'
    runs-on: ubuntu-24.04
    # GCC 14: GCC 13 (ubuntu-24.04's default) at -O3 builds raylib 6.0 with
    # broken render textures (incomplete framebuffers, viewports drawn black)
    env:
      CC: gcc-14
      CXX: g++-14
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJson(needs.prepare.outputs.backends_json) }}
    name: Build Linux x86_64 (${{ matrix.backend }})
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache dependencies (URL tarballs)
        uses: actions/cache@v4
        with:
          path: build-linux-x86_64/downloads
          key: deps-url-linux-x86_64-${{ hashFiles('cmake/litergss-app/dependencies/*.cmake') }}-v5
          restore-keys: deps-url-linux-x86_64-

      - name: Cache dependencies (git repos)
        uses: actions/cache@v4
        with:
          path: build-linux-x86_64/git-cache
          key: deps-git-linux-x86_64-${{ hashFiles('cmake/litergss-app/dependencies/*.cmake') }}
          restore-keys: deps-git-linux-x86_64-

      - name: Pre-download dependencies
        run: |
          cmake \
            -DDEPS_DIR=${{ github.workspace }}/cmake/litergss-app/dependencies \
            -DDOWNLOAD_DIR=${{ github.workspace }}/build-linux-x86_64/downloads \
            -DGIT_CACHE_DIR=${{ github.workspace }}/build-linux-x86_64/git-cache \
            -P cmake/docker/PreloadDeps.cmake

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14 \
            build-essential cmake ruby-dev ninja-build \
            libtool autoconf automake libncurses-dev \
            zip unzip wget gettext patch \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libudev-dev libasound2-dev libpulse-dev pkg-config

      - name: Configure
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=${{ matrix.backend }} \
            --without-docker \
            --with-toolchain-params=toolchain-params/x86_64-linux-toolchain.params \
            --build-dir=build-linux-x86_64 \
            --target-dir=target-linux-x86_64 \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Build
        run: make build

      - name: Test
        run: make test

      # Ruby client code (ruby/litergss): its logic against a fake LiteRGSS
      - name: Ruby client test
        run: |
          ruby -e 'require "minitest"' 2>/dev/null || sudo gem install --no-document minitest
          ruby ruby/test/test_touch_overlay.rb

      - name: Export build outputs
        run: make export

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-x86_64-${{ matrix.backend }}
          path: target-linux-x86_64/
          if-no-files-found: error
          retention-days: 1

  # --- iOS (macOS, parallel per target) ---
  build-ios:
    needs: prepare
    if: needs.prepare.outputs.has_ios == 'true'
    runs-on: macos-15
    strategy:
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.ios_targets_json) }}
    name: Build iOS (${{ matrix.target }})
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache dependencies (URL tarballs)
        uses: actions/cache@v4
        with:
          path: build-ios/downloads
          key: deps-url-ios-${{ matrix.target }}-${{ hashFiles('cmake/litergss-app/dependencies/*.cmake') }}-v5
          restore-keys: |
            deps-url-ios-${{ matrix.target }}-
            deps-url-ios-

      - name: Cache dependencies (git repos)
        uses: actions/cache@v4
        with:
          path: build-ios/git-cache
          key: deps-git-ios-${{ matrix.target }}-${{ hashFiles('cmake/litergss-app/dependencies/*.cmake') }}
          restore-keys: |
            deps-git-ios-${{ matrix.target }}-
            deps-git-ios-

      - name: Pre-download dependencies
        run: |
          cmake \
            -DDEPS_DIR=${{ github.workspace }}/cmake/litergss-app/dependencies \
            -DDOWNLOAD_DIR=${{ github.workspace }}/build-ios/downloads \
            -DGIT_CACHE_DIR=${{ github.workspace }}/build-ios/git-cache \
            -P cmake/docker/PreloadDeps.cmake

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool cmake
          echo "Xcode version:"
          xcodebuild -version
          echo "iOS SDK path:"
          xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "(not available)"
          echo "iOS Simulator SDK path:"
          xcrun --sdk iphonesimulator --show-sdk-path 2>/dev/null || echo "(not available)"

      - name: Configure
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=sfml \
            --without-docker \
            --with-toolchain-params=toolchain-params/${{ matrix.target }}-toolchain.params \
            --enable-static \
            --build-dir=build-ios \
            --target-dir=target-ios \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Build
        run: make build

      - name: Export build outputs
        run: make export

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-${{ matrix.target }}
          path: target-ios/
          if-no-files-found: error
          retention-days: 1

  # --- macOS ARM64 (local) ---
  build-macos:
    needs: prepare
    if: needs.prepare.outputs.has_macos == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJson(needs.prepare.outputs.backends_json) }}
    name: Build macOS arm64 (${{ matrix.backend }})
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache dependencies (URL tarballs)
        uses: actions/cache@v4
        with:
          path: build-macos/downloads
          key: deps-url-macos-arm64-${{ hashFiles('cmake/litergss-app/dependencies/*.cmake') }}-v5
          restore-keys: deps-url-macos-arm64-

      - name: Cache dependencies (git repos)
        uses: actions/cache@v4
        with:
          path: build-macos/git-cache
          key: deps-git-macos-arm64-${{ hashFiles('cmake/litergss-app/dependencies/*.cmake') }}
          restore-keys: deps-git-macos-arm64-

      - name: Pre-download dependencies
        run: |
          cmake \
            -DDEPS_DIR=${{ github.workspace }}/cmake/litergss-app/dependencies \
            -DDOWNLOAD_DIR=${{ github.workspace }}/build-macos/downloads \
            -DGIT_CACHE_DIR=${{ github.workspace }}/build-macos/git-cache \
            -P cmake/docker/PreloadDeps.cmake

      - name: Install build dependencies
        run: brew install autoconf automake libtool cmake

      - name: Configure
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=${{ matrix.backend }} \
            --without-docker \
            --with-toolchain-params=toolchain-params/arm64-macos-toolchain.params \
            --enable-static \
            --build-dir=build-macos \
            --target-dir=target-macos \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Build
        run: make build

      - name: Export build outputs
        run: make export

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-arm64-${{ matrix.backend }}
          path: target-macos/
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  #  INSTALL PHASE — publish KMP artifacts (each depends on its build)
  # ===========================================================================

  # --- Install Android: merge ABIs + build .so wrappers + publish AAR ---
  install-android:
    needs: [prepare, build-android]
    if: needs.prepare.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJson(needs.prepare.outputs.backends_json) }}
        tracy: [false, true]
    name: Install Android (${{ matrix.backend }}${{ matrix.tracy && ', Tracy' || '' }})
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download per-ABI build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.tracy && 'build-tracy-android' || 'build-android' }}-${{ matrix.backend }}-*
          path: build-artifacts

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle's dependencies and wrapper: without them every run downloads
      # them from Maven Central, which answers parallel jobs with 429s
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-install-android-${{ runner.os }}-${{ hashFiles('external/embedded-ruby-vm/kmp-publish/**/*.gradle*', 'external/embedded-ruby-vm/kmp-publish/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-install-android-${{ runner.os }}-

      - name: Configure
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=${{ matrix.backend }} \
            --without-docker \
            ${{ needs.prepare.outputs.android_toolchain_args }} \
            --build-dir=build-android \
            --target-dir=target-android \
            ${{ matrix.tracy && '--enable-tracy' || '' }} \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Merge ABI exports
        run: |
          MERGE_SOURCES=""
          for dir in build-artifacts/*/; do
            [ -d "$dir" ] || continue
            MERGE_SOURCES="$MERGE_SOURCES $dir"
          done
          make merge-exports MERGE_SOURCES="$MERGE_SOURCES"

      - name: Publish
        env:
          # Without it the Gradle publication falls back to NEXT_VERSION-SNAPSHOT,
          # and a release tag ships artifacts whose POM says -SNAPSHOT.
          KMP_VERSION: ${{ matrix.tracy && fromJson(needs.prepare.outputs.versions_json)[matrix.backend].tracy || fromJson(needs.prepare.outputs.versions_json)[matrix.backend].version }}
        run: make publish-kmp

      - name: Find AAR artifact
        id: find-aar
        run: |
          AAR_PATH=$(find target-android/maven -name '*.aar' 2>/dev/null | head -1)
          if [ -z "$AAR_PATH" ]; then
            echo "ERROR: No AAR file found in target-android/maven"
            exit 1
          fi
          echo "aar_path=$AAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Found AAR: $AAR_PATH"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-android-${{ matrix.backend }}${{ matrix.tracy && '-tracy' || '' }}
          path: ${{ steps.find-aar.outputs.aar_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload Maven repo
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-android-${{ matrix.backend }}${{ matrix.tracy && '-tracy' || '' }}-maven
          path: target-android/maven/
          if-no-files-found: warn
          retention-days: 1

  # --- Install Linux x86_64: build .so wrapper + publish Desktop JAR + Linux Native klib ---
  install-linux-x86_64:
    needs: [prepare, build-linux-x86_64]
    if: needs.prepare.outputs.has_linux_x86_64 == 'true'
    runs-on: ubuntu-24.04
    # GCC 14: GCC 13 (ubuntu-24.04's default) at -O3 builds raylib 6.0 with
    # broken render textures (incomplete framebuffers, viewports drawn black)
    env:
      CC: gcc-14
      CXX: g++-14
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJson(needs.prepare.outputs.backends_json) }}
    name: Install Linux x86_64 (${{ matrix.backend }})
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-linux-x86_64-${{ matrix.backend }}
          path: target-linux-x86_64

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14 \
            build-essential cmake \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libudev-dev pkg-config

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle's dependencies and wrapper: without them every run downloads
      # them from Maven Central, which answers parallel jobs with 429s
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-install-linux-x86_64-${{ runner.os }}-${{ hashFiles('external/embedded-ruby-vm/kmp-publish/**/*.gradle*', 'external/embedded-ruby-vm/kmp-publish/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-install-linux-x86_64-${{ runner.os }}-

      - name: Configure
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=${{ matrix.backend }} \
            --without-docker \
            --with-toolchain-params=toolchain-params/x86_64-linux-toolchain.params \
            --build-dir=build-linux-x86_64 \
            --target-dir=target-linux-x86_64 \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Publish
        env:
          # Without it the Gradle publication falls back to NEXT_VERSION-SNAPSHOT,
          # and a release tag ships artifacts whose POM says -SNAPSHOT.
          KMP_VERSION: ${{ fromJson(needs.prepare.outputs.versions_json)[matrix.backend].version }}
        run: make publish-kmp

      - name: Check the standalone runtime
        run: |
          runtime=target-linux-x86_64/runtime/x86_64-linux
          "$runtime/ruby" -e 'require "LiteRGSS"; puts RUBY_DESCRIPTION'

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-linux-x86_64-${{ matrix.backend }}
          path: target-linux-x86_64/
          if-no-files-found: error
          retention-days: 1

  # --- Install iOS: merge targets + build XCFramework ---
  install-ios:
    needs: [prepare, build-ios]
    if: needs.prepare.outputs.has_ios == 'true'
    runs-on: macos-15
    name: Install iOS
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download per-target build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: build-ios-*
          path: build-artifacts

      - name: Install build dependencies
        run: brew install autoconf automake libtool cmake

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle's dependencies and wrapper: without them every run downloads
      # them from Maven Central, which answers parallel jobs with 429s
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-install-ios-${{ runner.os }}-${{ hashFiles('external/embedded-ruby-vm/kmp-publish/**/*.gradle*', 'external/embedded-ruby-vm/kmp-publish/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-install-ios-${{ runner.os }}-

      - name: Configure
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=sfml \
            --without-docker \
            --with-toolchain-params=toolchain-params/arm64-ios-device-toolchain.params \
            --with-toolchain-params=toolchain-params/arm64-ios-simulator-toolchain.params \
            --enable-static \
            --build-dir=build-ios \
            --target-dir=target-ios \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Merge target exports
        run: |
          MERGE_SOURCES=""
          for dir in build-artifacts/build-ios-*/; do
            [ -d "$dir" ] || continue
            MERGE_SOURCES="$MERGE_SOURCES $dir"
          done
          make merge-exports MERGE_SOURCES="$MERGE_SOURCES"

      - name: Publish
        env:
          # Without it the Gradle publication falls back to NEXT_VERSION-SNAPSHOT,
          # and a release tag ships artifacts whose POM says -SNAPSHOT.
          KMP_VERSION: ${{ fromJson(needs.prepare.outputs.versions_json).sfml.version }}
        run: make publish-kmp

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-ios
          path: target-ios/
          if-no-files-found: error
          retention-days: 1

  # --- Install macOS: build .dylib wrapper + publish Desktop JAR ---
  install-macos:
    needs: [prepare, build-macos]
    if: needs.prepare.outputs.has_macos == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJson(needs.prepare.outputs.backends_json) }}
    name: Install macOS arm64 (${{ matrix.backend }})
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-macos-arm64-${{ matrix.backend }}
          path: target-macos

      - name: Install build dependencies
        run: brew install autoconf automake libtool cmake

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle's dependencies and wrapper: without them every run downloads
      # them from Maven Central, which answers parallel jobs with 429s
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-install-macos-${{ runner.os }}-${{ hashFiles('external/embedded-ruby-vm/kmp-publish/**/*.gradle*', 'external/embedded-ruby-vm/kmp-publish/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-install-macos-${{ runner.os }}-

      - name: Configure
        run: |
          ./configure \
            --with-ruby-variant=${{ needs.prepare.outputs.ruby_variant }} \
            --with-backend=${{ matrix.backend }} \
            --without-docker \
            --with-toolchain-params=toolchain-params/arm64-macos-toolchain.params \
            --enable-static \
            --build-dir=build-macos \
            --target-dir=target-macos \
            ${{ needs.prepare.outputs.build_type_flag }}

      - name: Publish
        env:
          # Without it the Gradle publication falls back to NEXT_VERSION-SNAPSHOT,
          # and a release tag ships artifacts whose POM says -SNAPSHOT.
          KMP_VERSION: ${{ fromJson(needs.prepare.outputs.versions_json)[matrix.backend].version }}
        run: make publish-kmp

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-macos-${{ matrix.backend }}
          path: target-macos/
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  #  KOTLIN HOST — kotlin/, the runtime's Android host (NativeSurface, the
  #  surface view, input forwarding) and the touch overlay's layout model.
  #  Pure Kotlin, the same for every Ruby variant: built and tested here,
  #  published by publish-kotlin-host once the runtime's packages are out.
  # ===========================================================================
  kotlin-host:
    needs: prepare
    if: needs.prepare.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    name: Kotlin host
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle's dependencies and wrapper: without them every run downloads
      # them from Maven Central, which answers parallel jobs with 429s
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-kotlin-host-${{ runner.os }}-${{ hashFiles('kotlin/**/*.gradle*', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-kotlin-host-${{ runner.os }}-

      - name: Build and test
        run: ./gradlew --no-daemon build

  # ===========================================================================
  #  PACKAGE — assemble the release and publish the Maven packages, in two
  #  jobs so the Android / Linux ones never wait for the (scarce) macOS
  #  runners: package-linux creates the GitHub Release, package-apple adds
  #  the iOS / macOS files to it afterwards.
  # ===========================================================================
  package-linux:
    needs: [prepare, install-android, install-linux-x86_64, kotlin-host]
    if: >-
      always()
      && (needs.kotlin-host.result == 'success' || needs.kotlin-host.result == 'skipped')
      && (needs.install-android.result == 'success' || needs.install-android.result == 'skipped')
      && (needs.install-linux-x86_64.result == 'success' || needs.install-linux-x86_64.result == 'skipped')
      && (needs.install-android.result == 'success' || needs.install-linux-x86_64.result == 'success')
    runs-on: ubuntu-latest
    name: Package Android / Linux artifacts
    permissions:
      contents: write
      packages: write
    env:
      BACKENDS: ${{ needs.prepare.outputs.backends }}
      VERSIONS: ${{ needs.prepare.outputs.versions_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: .github/scripts

      # One directory per artifact: staging/intermediate-android-<backend>[-tracy][-maven],
      # staging/intermediate-linux-x86_64-<backend>
      - name: Download Android builds
        if: needs.prepare.outputs.has_android == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: intermediate-android-*
          path: staging

      - name: Download Linux x86_64 builds
        if: needs.prepare.outputs.has_linux_x86_64 == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: intermediate-linux-x86_64-*
          path: staging

      - name: Assemble release
        run: |
          mkdir -p release
          for B in ${BACKENDS//,/ }; do
            if [ -d "staging/intermediate-android-$B" ]; then
              mkdir -p "release/$B/android"
              cp staging/intermediate-android-$B/*.aar "release/$B/android/"
            fi
            if [ -d "staging/intermediate-linux-x86_64-$B" ]; then
              mkdir -p "release/$B/linux-x86_64"
              cp -r staging/intermediate-linux-x86_64-$B/* "release/$B/linux-x86_64/"
            fi
          done
          echo "=== Final release contents ==="
          find release -type f | sort

      - name: Upload final release artifact
        uses: actions/upload-artifact@v4
        with:
          name: litergss-release-linux
          path: release/
          if-no-files-found: error
          retention-days: 30

      # --- GitHub Release (only on tag pushes) ---

      - name: Assemble release archives
        if: needs.prepare.outputs.is_release == 'true'
        run: |
          mkdir -p release-assets
          for B in ${BACKENDS//,/ }; do
            VERSION=$(jq -r --arg b "$B" '.[$b].version' <<< "$VERSIONS")
            TRACY_VERSION=$(jq -r --arg b "$B" '.[$b].tracy' <<< "$VERSIONS")
            for aar in staging/intermediate-android-$B/*.aar; do
              [ -f "$aar" ] || continue
              cp "$aar" "release-assets/$(basename "$aar" .aar)-${VERSION}.aar"
            done
            for aar in staging/intermediate-android-$B-tracy/*.aar; do
              [ -f "$aar" ] || continue
              cp "$aar" "release-assets/$(basename "$aar" .aar)-${TRACY_VERSION}.aar"
            done
            LINUX="staging/intermediate-linux-x86_64-$B"
            if [ -d "$LINUX" ]; then
              tar -czf "release-assets/litergss-linux-x86_64-${VERSION}.tar.gz" --exclude=./runtime -C "$LINUX" .
              # Artifacts lose the executable bit on the way here
              chmod +x "$LINUX/runtime/x86_64-linux/ruby"
              tar -czf "release-assets/litergss-runtime-linux-x86_64-${VERSION}.tar.gz" -C "$LINUX/runtime/x86_64-linux" .
            fi
          done
          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Create GitHub Release
        if: needs.prepare.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: LiteRGSS ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Publish to GitHub Packages (Maven) ---

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write Maven settings
        run: |
          cat > /tmp/maven-settings.xml <<SETTINGS_EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS_EOF

      - name: Delete existing SNAPSHOT package versions
        if: needs.prepare.outputs.is_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Every backend's runtime version and Tracy one (rgss-runtime-android only)
        run: .github/scripts/delete-snapshots.sh linux $(jq -r '.[] | .version, .tracy' <<< "$VERSIONS")

      - name: Publish to GitHub Packages
        run: |
          for B in ${BACKENDS//,/ }; do
            VERSION=$(jq -r --arg b "$B" '.[$b].version' <<< "$VERSIONS")
            TRACY_VERSION=$(jq -r --arg b "$B" '.[$b].tracy' <<< "$VERSIONS")
            if [ "${{ needs.prepare.outputs.has_android }}" = true ]; then
              .github/scripts/deploy-maven.sh rgss-runtime-android "$VERSION" aar "staging/intermediate-android-$B-maven"
              .github/scripts/deploy-maven.sh rgss-runtime-android "$TRACY_VERSION" aar "staging/intermediate-android-$B-tracy-maven"
            fi
            if [ "${{ needs.prepare.outputs.has_linux_x86_64 }}" = true ]; then
              LINUX="staging/intermediate-linux-x86_64-$B"
              .github/scripts/deploy-maven.sh rgss-runtime-desktop "$VERSION" jar "$LINUX/maven" optional
              .github/scripts/deploy-maven.sh rgss-runtime-linuxx64 "$VERSION" klib "$LINUX/maven-native" optional
            fi
          done

  # litergss-host X.Y.Z, once per release (the default variant's tag), only
  # after rgss-runtime-android X.Y.Z-rubyA.B is out: a failed Android / Linux
  # release publishes neither.
  publish-kotlin-host:
    needs: [prepare, package-linux]
    if: >-
      always()
      && needs.package-linux.result == 'success'
      && needs.prepare.outputs.is_release == 'true'
      && needs.prepare.outputs.is_default_variant == 'true'
      && needs.prepare.outputs.has_sfml == 'true'
      && needs.prepare.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    name: Publish Kotlin host
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle's dependencies and wrapper: without them every run downloads
      # them from Maven Central, which answers parallel jobs with 429s
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-publish-kotlin-host-${{ runner.os }}-${{ hashFiles('kotlin/**/*.gradle*', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-publish-kotlin-host-${{ runner.os }}-

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ fromJson(needs.prepare.outputs.versions_json).sfml.version }}"
          ./gradlew --no-daemon publishAllPublicationsToGithubRepository -Pversion="${VERSION%-ruby*}"

  package-apple:
    # After package-linux: it creates the GitHub Release this job adds to.
    # Runs when the Android / Linux side succeeded or was not built.
    needs: [prepare, install-android, install-linux-x86_64, install-ios, install-macos, kotlin-host, package-linux]
    if: >-
      always()
      && (needs.kotlin-host.result == 'success' || needs.kotlin-host.result == 'skipped')
      && (needs.install-android.result == 'success' || needs.install-android.result == 'skipped')
      && (needs.install-linux-x86_64.result == 'success' || needs.install-linux-x86_64.result == 'skipped')
      && (needs.package-linux.result == 'success' || needs.package-linux.result == 'skipped')
      && (needs.install-ios.result == 'success' || needs.install-ios.result == 'skipped')
      && (needs.install-macos.result == 'success' || needs.install-macos.result == 'skipped')
      && (needs.install-ios.result == 'success' || needs.install-macos.result == 'success')
    runs-on: ubuntu-latest
    name: Package iOS / macOS artifacts
    permissions:
      contents: write
      packages: write
    env:
      BACKENDS: ${{ needs.prepare.outputs.backends }}
      VERSIONS: ${{ needs.prepare.outputs.versions_json }}
      # iOS is sfml's only (raylib 6 has no iOS platform)
      IOS_VERSION: ${{ fromJson(needs.prepare.outputs.versions_json).sfml.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: .github/scripts

      - name: Download iOS build
        if: needs.prepare.outputs.has_ios == 'true'
        uses: actions/download-artifact@v4
        with:
          name: intermediate-ios
          path: staging/ios

      # staging/intermediate-macos-<backend>
      - name: Download macOS builds
        if: needs.prepare.outputs.has_macos == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: intermediate-macos-*
          path: staging

      - name: Assemble release
        run: |
          mkdir -p release
          if [ -d staging/ios ]; then
            mkdir -p release/sfml/ios
            # Copy build archives (flat, from both device + simulator ABIs)
            find staging/ios -maxdepth 1 -type f -exec cp {} release/sfml/ios/ \;
            # Copy XCFramework if present
            if [ -d staging/ios/xcframework ]; then
              mkdir -p release/sfml/xcframework
              cp -r staging/ios/xcframework/* release/sfml/xcframework/
            fi
          fi
          for B in ${BACKENDS//,/ }; do
            if [ -d "staging/intermediate-macos-$B" ]; then
              mkdir -p "release/$B/macos"
              cp -r staging/intermediate-macos-$B/* "release/$B/macos/"
            fi
          done
          echo "=== Final release contents ==="
          find release -type f | sort

      - name: Upload final release artifact
        uses: actions/upload-artifact@v4
        with:
          name: litergss-release-apple
          path: release/
          if-no-files-found: error
          retention-days: 30

      # --- GitHub Release (only on tag pushes) ---

      - name: Assemble release archives
        if: needs.prepare.outputs.is_release == 'true'
        run: |
          mkdir -p release-assets

          if [ -d staging/ios ]; then
            # Archive iOS build outputs (excludes xcframework subdir)
            tar -czf "release-assets/litergss-ios-${IOS_VERSION}.tar.gz" \
              --exclude='xcframework' -C staging/ios .
          fi

          if [ -d staging/ios/xcframework ]; then
            # ZIP format required for Swift Package Manager binary targets
            (cd staging/ios/xcframework && zip -r "$GITHUB_WORKSPACE/release-assets/RubyVM-xcframework-${IOS_VERSION}.zip" .)
          fi

          for B in ${BACKENDS//,/ }; do
            VERSION=$(jq -r --arg b "$B" '.[$b].version' <<< "$VERSIONS")
            if [ -d "staging/intermediate-macos-$B" ]; then
              tar -czf "release-assets/litergss-macos-arm64-${VERSION}.tar.gz" -C "staging/intermediate-macos-$B" .
            fi
          done

          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Add to the GitHub Release
        # package-linux created the release (with its notes); only add files.
        # Creates it when Android / Linux were not built.
        if: needs.prepare.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: LiteRGSS ${{ github.ref_name }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Package.swift with XCFramework checksum
        # Package.swift on master tracks the default Ruby variant (sfml: iOS)
        if: needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.has_ios == 'true' && needs.prepare.outputs.is_default_variant == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$IOS_VERSION"
          ZIP_FILE="release-assets/RubyVM-xcframework-${VERSION}.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Warning: XCFramework ZIP not found, skipping Package.swift update"
            exit 0
          fi

          CHECKSUM=$(swift package compute-checksum "$ZIP_FILE" 2>/dev/null \
            || shasum -a 256 "$ZIP_FILE" | awk '{print $1}')
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/RubyVM-xcframework-${VERSION}.zip"

          echo "XCFramework URL: $URL"
          echo "XCFramework checksum: $CHECKSUM"

          # Checkout repo to update Package.swift
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" repo-checkout
          cd repo-checkout

          cat > Package.swift <<SWIFT_EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "RubyVM",
              platforms: [
                  .iOS(.v14)
              ],
              products: [
                  .library(name: "RubyVM", targets: ["RubyVM"])
              ],
              targets: [
                  .binaryTarget(
                      name: "RubyVM",
                      url: "$URL",
                      checksum: "$CHECKSUM"
                  )
              ]
          )
          SWIFT_EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: update Package.swift for v${VERSION}"
          git push origin master

      # --- Publish to GitHub Packages (Maven) ---

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write Maven settings
        run: |
          cat > /tmp/maven-settings.xml <<SETTINGS_EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS_EOF

      - name: Delete existing SNAPSHOT package versions
        if: needs.prepare.outputs.is_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/delete-snapshots.sh apple $(jq -r '.[].version' <<< "$VERSIONS")

      - name: Publish macOS Desktop JARs to GitHub Packages
        if: needs.prepare.outputs.has_macos == 'true'
        run: |
          for B in ${BACKENDS//,/ }; do
            VERSION=$(jq -r --arg b "$B" '.[$b].version' <<< "$VERSIONS")
            .github/scripts/deploy-maven.sh rgss-runtime-desktop-macos "$VERSION" jar "staging/intermediate-macos-$B/maven" optional
          done

      # --- iOS + KMP metadata (built by install-ios, which runs on macOS) ---

      - name: Publish iOS and KMP metadata to GitHub Packages
        if: needs.prepare.outputs.has_ios == 'true'
        run: |
          KMP=staging/ios/maven-kmp
          # The .module (Gradle module metadata) enables commonMain dependency
          # resolution across all targets
          .github/scripts/deploy-maven.sh rgss-runtime "$IOS_VERSION" module "$KMP/rgss-runtime" optional
          .github/scripts/deploy-maven.sh rgss-runtime-iosarm64 "$IOS_VERSION" klib "$KMP/rgss-runtime-iosarm64" optional
          .github/scripts/deploy-maven.sh rgss-runtime-iossimulatorarm64 "$IOS_VERSION" klib "$KMP/rgss-runtime-iossimulatorarm64" optional

          for native_zip in staging/ios/native-ios/*.zip; do
            [ -f "$native_zip" ] || continue
            ARTIFACT_ID=$(basename "$native_zip" .zip)
            echo "Publishing $ARTIFACT_ID native library"
            mvn deploy:deploy-file \
              -DgroupId=com.scorbutics.rubyvm \
              -DartifactId="$ARTIFACT_ID" \
              -Dversion="$IOS_VERSION" \
              -Dpackaging=zip \
              -Dfile="$native_zip" \
              -DgeneratePom=true \
              -DrepositoryId=github \
              -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
              --settings /tmp/maven-settings.xml
          done
